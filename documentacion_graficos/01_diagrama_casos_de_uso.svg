<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; }
      .actor-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .usecase-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; fill: #0f172a; text-anchor: middle; font-weight: 500; }
      .include-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #64748b; font-style: italic; text-anchor: middle; }
      .sys-box { fill: #f8fafc; stroke: #3b82f6; stroke-width: 2; rx: 12; }
      .usecase-ellipse { fill: #ffffff; stroke: #2563eb; stroke-width: 1.8; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
      .usecase-ext { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .line { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .line-dash { stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; }
      .actor-body { stroke: #1e3a8a; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .actor-head { fill: #dbeafe; stroke: #1e3a8a; stroke-width: 2.2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#ffffff" />

  <!-- Encabezado -->
  <text x="600" y="38" text-anchor="middle" class="title">DIAGRAMA DE CASOS DE USO GENERAL DEL SISTEMA</text>
  <text x="600" y="60" text-anchor="middle" class="subtitle">Sistema de Información Web para la Gestión de Licencias y Vacaciones Docentes - UNSXX</text>

  <!-- Límite del Sistema -->
  <rect x="230" y="80" width="740" height="790" class="sys-box" />
  <rect x="230" y="80" width="740" height="38" fill="#e0f2fe" rx="12" />
  <rect x="230" y="105" width="740" height="13" fill="#e0f2fe" />
  <text x="600" y="105" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="14" font-weight="bold" fill="#0369a1">
    SISTEMA DE GESTIÓN DE LICENCIAS Y VACACIONES (LÍMITE DEL SISTEMA)
  </text>

  <!-- ================= ACTORES ================= -->
  <!-- Helper function for actor -->

    <g transform="translate(110, 240)">
      <circle cx="0" cy="-35" r="14" class="actor-head" />
      <line x1="0" y1="-21" x2="0" y2="10" class="actor-body" />
      <line x1="-22" y1="-10" x2="22" y2="-10" class="actor-body" />
      <line x1="0" y1="10" x2="-16" y2="35" class="actor-body" />
      <line x1="0" y1="10" x2="16" y2="35" class="actor-body" />
      <text x="0" y="55" class="actor-label">Docente</text>
      <text x="0" y="70" class="include-text">(Solicitante)</text>
    </g>
    <g transform="translate(110, 470)">
      <circle cx="0" cy="-35" r="14" class="actor-head" />
      <line x1="0" y1="-21" x2="0" y2="10" class="actor-body" />
      <line x1="-22" y1="-10" x2="22" y2="-10" class="actor-body" />
      <line x1="0" y1="10" x2="-16" y2="35" class="actor-body" />
      <line x1="0" y1="10" x2="16" y2="35" class="actor-body" />
      <text x="0" y="55" class="actor-label">Director de Carrera</text>
      <text x="0" y="70" class="include-text">(Evaluador 1)</text>
    </g>
    <g transform="translate(110, 710)">
      <circle cx="0" cy="-35" r="14" class="actor-head" />
      <line x1="0" y1="-21" x2="0" y2="10" class="actor-body" />
      <line x1="-22" y1="-10" x2="22" y2="-10" class="actor-body" />
      <line x1="0" y1="10" x2="-16" y2="35" class="actor-body" />
      <line x1="0" y1="10" x2="16" y2="35" class="actor-body" />
      <text x="0" y="55" class="actor-label">Director de Área</text>
      <text x="0" y="70" class="include-text">(Evaluador 2)</text>
    </g>
    <g transform="translate(1080, 450)">
      <circle cx="0" cy="-35" r="14" class="actor-head" />
      <line x1="0" y1="-21" x2="0" y2="10" class="actor-body" />
      <line x1="-22" y1="-10" x2="22" y2="-10" class="actor-body" />
      <line x1="0" y1="10" x2="-16" y2="35" class="actor-body" />
      <line x1="0" y1="10" x2="16" y2="35" class="actor-body" />
      <text x="0" y="55" class="actor-label">Jefatura de Personal</text>
      <text x="0" y="70" class="include-text">(Administrador Central)</text>
    </g>
    <!-- Generalización de roles -->
    <path d="M 110,400 L 110,335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
    <polygon points="110,325 104,337 116,337" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="115" y="370" font-family="'Segoe UI', Arial" font-size="10" fill="#64748b">es un</text>

    <path d="M 110,640 L 110,570" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
    <polygon points="110,560 104,572 116,572" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    
    <g id="uc1">
      <ellipse cx="400" cy="155" rx="110" ry="26" class="usecase-ellipse" /><text x="400" y="152" class="usecase-text">Iniciar Sesión y Autenticación</text><text x="400" y="168" class="usecase-text">con Código Institucional</text></g>
    <g id="uc2">
      <ellipse cx="770" cy="155" rx="105" ry="26" class="usecase-ellipse" /><text x="770" y="152" class="usecase-text">Consultar Código de Ingreso</text><text x="770" y="168" class="usecase-text">mediante Cédula de Identidad</text></g>
    <g id="uc3">
      <ellipse cx="400" cy="235" rx="110" ry="26" class="usecase-ellipse" /><text x="400" y="232" class="usecase-text">Consultar Saldo de Vacaciones</text><text x="400" y="248" class="usecase-text">y Años de Antigüedad</text></g>
    <g id="uc4">
      <ellipse cx="400" cy="320" rx="115" ry="27" class="usecase-ellipse" /><text x="400" y="317" class="usecase-text">Registrar Solicitud de Licencia</text><text x="400" y="333" class="usecase-text">(Día Completo o Media Jornada)</text></g>
    <g id="uc_val">
      <ellipse cx="720" cy="320" rx="105" ry="24" class="usecase-ellipse usecase-ext" /><text x="720" y="317" class="usecase-text">Validar No Solapamiento</text><text x="720" y="333" class="usecase-text">y Días Disponibles</text></g>
    <g id="uc5">
      <ellipse cx="400" cy="405" rx="105" ry="24" class="usecase-ellipse" /><text x="400" y="402" class="usecase-text">Cancelar Solicitud Pendiente</text><text x="400" y="418" class="usecase-text">de Aprobación</text></g>
    <g id="uc6">
      <ellipse cx="410" cy="495" rx="115" ry="26" class="usecase-ellipse" /><text x="410" y="492" class="usecase-text">Evaluar Solicitud de Carrera</text><text x="410" y="508" class="usecase-text">(Aprobar / Rechazar)</text></g>
    <g id="uc7">
      <ellipse cx="410" cy="580" rx="115" ry="26" class="usecase-ellipse" /><text x="410" y="577" class="usecase-text">Evaluar Solicitud de Área</text><text x="410" y="593" class="usecase-text">(Aprobar / Rechazar)</text></g>
    <g id="uc8">
      <ellipse cx="620" cy="660" rx="125" ry="28" class="usecase-ellipse" /><text x="620" y="657" class="usecase-text">Dictaminar Resolución Final</text><text x="620" y="673" class="usecase-text">(Aprobar / Rechazar y Descontar)</text></g>
    <g id="uc9">
      <ellipse cx="800" cy="440" rx="115" ry="26" class="usecase-ellipse" /><text x="800" y="437" class="usecase-text">Gestionar Personal Docente</text><text x="800" y="453" class="usecase-text">(Altas, Edición, Códigos)</text></g>
    <g id="uc10">
      <ellipse cx="800" cy="525" rx="110" ry="25" class="usecase-ellipse" /><text x="800" y="522" class="usecase-text">Configurar Servidor de</text><text x="800" y="538" class="usecase-text">Correo Institucional (SMTP)</text></g>
    <g id="uc11">
      <ellipse cx="800" cy="745" rx="115" ry="26" class="usecase-ellipse" /><text x="800" y="742" class="usecase-text">Emitir Boletas e Informes</text><text x="800" y="758" class="usecase-text">Imprimibles con Firmas</text></g>
    <g id="uc12">
      <ellipse cx="410" cy="755" rx="110" ry="25" class="usecase-ellipse" /><text x="410" y="752" class="usecase-text">Consultar Historial y Kardex</text><text x="410" y="768" class="usecase-text">de Licencias Otorgadas</text></g>
    <!-- Asociaciones Docente -->
    <line x1="160" y1="230" x2="295" y2="165" class="line" />
    <line x1="160" y1="240" x2="290" y2="235" class="line" />
    <line x1="160" y1="250" x2="285" y2="320" class="line" />
    <line x1="160" y1="260" x2="295" y2="400" class="line" />
    <line x1="150" y1="280" x2="310" y2="745" class="line" />

    <!-- Asociaciones Director Carrera -->
    <line x1="170" y1="470" x2="295" y2="495" class="line" />

    <!-- Asociaciones Director Área -->
    <line x1="170" y1="710" x2="295" y2="590" class="line" />

    <!-- Asociaciones Jefatura de Personal -->
    <line x1="1020" y1="420" x2="515" y2="160" class="line" />
    <line x1="1020" y1="435" x2="875" y2="175" class="line" />
    <line x1="1020" y1="445" x2="915" y2="440" class="line" />
    <line x1="1020" y1="460" x2="910" y2="525" class="line" />
    <line x1="1020" y1="480" x2="745" y2="660" class="line" />
    <line x1="1020" y1="500" x2="915" y2="745" class="line" />
    <line x1="1020" y1="520" x2="520" y2="760" class="line" />

    <!-- Inclusiones / Extensiones <<include>> -->
    <line x1="515" y1="320" x2="615" y2="320" class="line-dash" marker-end="url(#arrow)" />
    <text x="565" y="312" class="include-text">&lt;&lt;include&gt;&gt;</text>

    <line x1="515" y1="155" x2="665" y2="155" class="line-dash" marker-end="url(#arrow)" />
    <text x="590" y="147" class="include-text">&lt;&lt;extend&gt;&gt;</text>
    
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 980" width="1150" height="980">
  <defs>
    <style>
      .main-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .main-subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .node-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .node-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #1e293b; text-anchor: middle; }
      .node-route { font-family: 'Courier New', monospace; font-size: 10px; fill: #0284c7; text-anchor: middle; font-weight: bold; }
      .role-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
      .flow-line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
      .flow-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; }
      .decision-diamond { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; }
    </style>
    <marker id="nav-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#64748b" />
    </marker>
    <marker id="nav-arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="1150" height="980" fill="#f8fafc" />

  <!-- Título -->
  <text x="575" y="35" class="main-title">DIAGRAMA DE NAVEGACIÓN Y FLUJO DE USUARIOS</text>
  <text x="575" y="55" class="main-subtitle">Rutas protegidas, bifurcación por roles y ciclo de vida de navegación en el sistema</text>

  <!-- ================= ACCESO Y AUTENTICACIÓN ================= -->
  <!-- Inicio -->
  <circle cx="575" cy="95" r="16" fill="#1e3a8a" />
  <circle cx="575" cy="95" r="12" fill="#ffffff" />
  <circle cx="575" cy="95" r="8" fill="#1e3a8a" />
  <text x="575" y="125" class="node-text" font-weight="bold">Inicio (/)</text>

  <line x1="575" y1="130" x2="575" y2="155" class="flow-line" marker-end="url(#nav-arrow)" />

  <!-- Pantalla Login -->
  <g transform="translate(475, 160)">
    <rect width="200" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))" />
    <rect width="200" height="22" rx="8" fill="#2563eb" />
    <rect y="14" width="200" height="8" fill="#2563eb" />
    <text x="100" y="16" class="node-title">Iniciar Sesión</text>
    <text x="100" y="38" class="node-text">Ingreso con Código y Clave</text>
    <text x="100" y="52" class="node-route">/ingresar</text>
  </g>

  <!-- Consulta CI -->
  <g transform="translate(180, 160)">
    <rect width="180" height="60" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />
    <text x="90" y="24" class="node-text" font-weight="bold" fill="#0369a1">Consultar Código</text>
    <text x="90" y="38" class="node-text">mediante Carnet de Identidad</text>
    <text x="90" y="52" class="node-route">/consultar-codigo</text>
  </g>
  <line x1="475" y1="190" x2="365" y2="190" class="flow-line" stroke-dasharray="4,3" marker-end="url(#nav-arrow)" />

  <line x1="575" y1="220" x2="575" y2="255" class="flow-line" marker-end="url(#nav-arrow)" />

  <!-- Rombo: ¿Debe cambiar contraseña? -->
  <g transform="translate(575, 290)">
    <polygon points="0,-30 80,0 0,30 -80,0" class="decision-diamond" />
    <text x="0" y="-5" class="node-text" font-size="10" font-weight="bold">¿Primer acceso?</text>
    <text x="0" y="8" class="node-text" font-size="9">(debe cambiar clave)</text>
  </g>

  <!-- Cambio Contraseña -->
  <g transform="translate(730, 260)">
    <rect width="180" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6" />
    <text x="90" y="24" class="node-text" font-weight="bold" fill="#b45309">Cambio Obligatorio</text>
    <text x="90" y="38" class="node-text">Actualización de contraseña</text>
    <text x="90" y="52" class="node-route">/contrasena</text>
  </g>
  <line x1="655" y1="290" x2="725" y2="290" class="flow-line" marker-end="url(#nav-arrow)" />
  <text x="680" y="282" class="flow-label" fill="#b45309">SÍ</text>
  
  <path d="M 820,320 L 820,360 L 590,360" class="flow-line" marker-end="url(#nav-arrow)" />

  <!-- Continuación NO -->
  <line x1="575" y1="320" x2="575" y2="385" class="flow-line" marker-end="url(#nav-arrow)" />
  <text x="585" y="340" class="flow-label" fill="#16a34a">NO</text>

  <!-- ================= BIFURCACIÓN DE ROLES ================= -->
  <!-- Línea horizontal de distribución -->
  <line x1="180" y1="390" x2="950" y2="390" class="flow-line-blue" />
  <line x1="575" y1="360" x2="575" y2="390" class="flow-line-blue" />

  <!-- ================= COLUMNA 1: ROL DOCENTE ================= -->
  <line x1="180" y1="390" x2="180" y2="420" class="flow-line-blue" marker-end="url(#nav-arrow-blue)" />

  <g transform="translate(80, 420)">
    <rect width="200" height="34" rx="8" fill="#2563eb" />
    <text x="100" y="22" class="role-tag">ROL: DOCENTE</text>

    <!-- Panel Docente -->
    <g transform="translate(0, 50)">
      <rect width="200" height="60" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="100" y="22" class="node-text" font-weight="bold">Panel del Docente</text>
      <text x="100" y="37" class="node-text">Saldos, Días y Resumen</text>
      <text x="100" y="52" class="node-route">/panel</text>
    </g>

    <!-- Mis Solicitudes -->
    <g transform="translate(0, 130)">
      <rect width="200" height="60" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="100" y="22" class="node-text" font-weight="bold">Mis Solicitudes</text>
      <text x="100" y="37" class="node-text">Listado y filtros por estado</text>
      <text x="100" y="52" class="node-route">/solicitudes</text>
    </g>

    <!-- Crear Solicitud -->
    <g transform="translate(0, 210)">
      <rect width="200" height="60" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8" />
      <text x="100" y="22" class="node-text" font-weight="bold" fill="#15803d">Nueva Solicitud</text>
      <text x="100" y="37" class="node-text">Días completos o 0.5 días</text>
      <text x="100" y="52" class="node-route">/solicitudes/crear</text>
    </g>

    <!-- Ver / Cancelar Solicitud -->
    <g transform="translate(0, 290)">
      <rect width="200" height="60" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="100" y="22" class="node-text" font-weight="bold">Detalle y Cancelación</text>
      <text x="100" y="37" class="node-text">Anulación si está pendiente</text>
      <text x="100" y="52" class="node-route">/solicitudes/{id}</text>
    </g>

    <!-- Historial Propio -->
    <g transform="translate(0, 370)">
      <rect width="200" height="60" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="100" y="22" class="node-text" font-weight="bold">Historial de Licencias</text>
      <text x="100" y="37" class="node-text">Kardex cronológico propio</text>
      <text x="100" y="52" class="node-route">/historial</text>
    </g>
  </g>

  <!-- Flechas internas columna docente -->
  <line x1="180" y1="530" x2="180" y2="550" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="180" y1="610" x2="180" y2="630" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="180" y1="690" x2="180" y2="710" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="180" y1="770" x2="180" y2="790" class="flow-line" marker-end="url(#nav-arrow)" />


  <!-- ================= COLUMNA 2: ROL DIRECTOR (CARRERA / ÁREA) ================= -->
  <line x1="540" y1="390" x2="540" y2="420" class="flow-line-blue" marker-end="url(#nav-arrow-blue)" />

  <g transform="translate(435, 420)">
    <rect width="210" height="34" rx="8" fill="#0d9488" />
    <text x="105" y="22" class="role-tag">DIRECTOR CARRERA / ÁREA</text>

    <!-- Panel Dirección -->
    <g transform="translate(0, 50)">
      <rect width="210" height="60" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" />
      <text x="105" y="22" class="node-text" font-weight="bold">Panel de Dirección</text>
      <text x="105" y="37" class="node-text">Conteo de pendientes y avisos</text>
      <text x="105" y="52" class="node-route">/panel</text>
    </g>

    <!-- Solicitudes Pendientes Dirección -->
    <g transform="translate(0, 130)">
      <rect width="210" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" />
      <text x="105" y="22" class="node-text" font-weight="bold" fill="#0f766e">Bandeja de Pendientes</text>
      <text x="105" y="37" class="node-text">Solicitudes de su carrera/área</text>
      <text x="105" y="52" class="node-route">/direccion/pendientes</text>
    </g>

    <!-- Evaluar / Decidir -->
    <g transform="translate(0, 210)">
      <rect width="210" height="60" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" />
      <text x="105" y="22" class="node-text" font-weight="bold">Evaluar Solicitud</text>
      <text x="105" y="37" class="node-text">Aprobar (pasa a Jefatura) o Rechazar</text>
      <text x="105" y="52" class="node-route">/direccion/decidir</text>
    </g>

    <!-- Historial Dirección -->
    <g transform="translate(0, 290)">
      <rect width="210" height="60" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" />
      <text x="105" y="22" class="node-text" font-weight="bold">Historial de Decisiones</text>
      <text x="105" y="37" class="node-text">Registro de dictámenes previos</text>
      <text x="105" y="52" class="node-route">/direccion/historial</text>
    </g>

    <!-- Nota de doble rol -->
    <g transform="translate(0, 370)">
      <rect width="210" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" />
      <text x="105" y="22" class="node-text" font-style="italic" fill="#475569">Módulo Docente Propio</text>
      <text x="105" y="37" class="node-text">Puede solicitar sus propias</text>
      <text x="105" y="52" class="node-text">vacaciones como docente</text>
    </g>
  </g>

  <!-- Flechas internas columna director -->
  <line x1="540" y1="530" x2="540" y2="550" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="540" y1="610" x2="540" y2="630" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="540" y1="690" x2="540" y2="710" class="flow-line" marker-end="url(#nav-arrow)" />


  <!-- ================= COLUMNA 3: ROL JEFATURA DE PERSONAL ================= -->
  <line x1="950" y1="390" x2="950" y2="420" class="flow-line-blue" marker-end="url(#nav-arrow-blue)" />

  <g transform="translate(840, 420)">
    <rect width="220" height="34" rx="8" fill="#b91c1c" />
    <text x="110" y="22" class="role-tag">JEFATURA DE PERSONAL</text>

    <!-- Panel Jefatura -->
    <g transform="translate(0, 50)">
      <rect width="220" height="50" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <text x="110" y="18" class="node-text" font-weight="bold">Panel General Jefatura</text>
      <text x="110" y="32" class="node-text">Métricas institucionales globales</text>
      <text x="110" y="44" class="node-route">/panel</text>
    </g>

    <!-- Gestión de Docentes -->
    <g transform="translate(0, 110)">
      <rect width="220" height="50" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <text x="110" y="18" class="node-text" font-weight="bold">Gestión de Docentes</text>
      <text x="110" y="32" class="node-text">Altas, edición y códigos DOC</text>
      <text x="110" y="44" class="node-route">/jefatura/docentes</text>
    </g>

    <!-- Solicitudes Pendientes Jefatura -->
    <g transform="translate(0, 170)">
      <rect width="220" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
      <text x="110" y="18" class="node-text" font-weight="bold" fill="#991b1b">Dictamen Final</text>
      <text x="110" y="32" class="node-text">Aprobar y descontar saldo</text>
      <text x="110" y="44" class="node-route">/jefatura/solicitudes/pendientes</text>
    </g>

    <!-- Padrón de Solicitudes -->
    <g transform="translate(0, 230)">
      <rect width="220" height="50" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <text x="110" y="18" class="node-text" font-weight="bold">Padrón de Solicitudes</text>
      <text x="110" y="32" class="node-text">Histórico general consolidado</text>
      <text x="110" y="44" class="node-route">/jefatura/solicitudes</text>
    </g>

    <!-- Personal y Jefes -->
    <g transform="translate(0, 290)">
      <rect width="220" height="50" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <text x="110" y="18" class="node-text" font-weight="bold">Personal Administrativo</text>
      <text x="110" y="32" class="node-text">Administración de directores</text>
      <text x="110" y="44" class="node-route">/jefatura/personal</text>
    </g>

    <!-- Avisos SMTP -->
    <g transform="translate(0, 350)">
      <rect width="220" height="50" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <text x="110" y="18" class="node-text" font-weight="bold">Configuración de Avisos</text>
      <text x="110" y="32" class="node-text">Credenciales Gmail SMTP TLS</text>
      <text x="110" y="44" class="node-route">/jefatura/avisos</text>
    </g>

    <!-- Impresión de Boletas -->
    <g transform="translate(0, 410)">
      <rect width="220" height="50" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <text x="110" y="18" class="node-text" font-weight="bold">Boletas e Impresión</text>
      <text x="110" y="32" class="node-text">Generación de reportes físicos</text>
      <text x="110" y="44" class="node-route">/jefatura/imprimir/...</text>
    </g>
  </g>

  <!-- Flechas internas columna jefatura -->
  <line x1="950" y1="505" x2="950" y2="525" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="950" y1="565" x2="950" y2="585" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="950" y1="625" x2="950" y2="645" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="950" y1="685" x2="950" y2="705" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="950" y1="745" x2="950" y2="765" class="flow-line" marker-end="url(#nav-arrow)" />
  <line x1="950" y1="805" x2="950" y2="825" class="flow-line" marker-end="url(#nav-arrow)" />

  <!-- ================= CIERRE DE SESIÓN ================= -->
  <g transform="translate(485, 905)">
    <rect width="180" height="40" rx="20" fill="#334155" />
    <text x="90" y="24" class="node-title" font-size="12">Cerrar Sesión (/salir)</text>
  </g>

  <path d="M 80,680 L 40,680 L 40,925 L 480,925" class="flow-line" stroke-dasharray="3,3" marker-end="url(#nav-arrow)" />
  <path d="M 1065,680 L 1100,680 L 1100,925 L 670,925" class="flow-line" stroke-dasharray="3,3" marker-end="url(#nav-arrow)" />

</svg>